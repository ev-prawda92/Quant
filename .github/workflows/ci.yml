name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nwc_quant/requirements.txt
      - run: pip install -r nwc_quant/requirements.txt
      - name: Synthetic demo must not fail
        run: |
          python -m nwc_quant.run | tee demo.txt
          ! grep -q "VERDICT: FAIL" demo.txt
      - name: Null control must fail
        run: |
          python -m nwc_quant.run --null | tee null.txt
          grep -q "VERDICT: FAIL" null.txt
